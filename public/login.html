<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | TRENDY_SHOP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 flex flex-col">

  <!-- 로고 -->
  <header class="py-6 text-center">
    <a href="index.html" class="text-2xl font-bold tracking-widest">TRENDY_SHOP</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 pb-16">
    <div class="w-full max-w-md bg-white border border-neutral-200 shadow-sm p-8 sm:p-10">
      <h1 class="text-xl font-bold text-center">로그인</h1>
      <p class="mt-2 text-sm text-neutral-500 text-center font-light">TRENDY_SHOP에 오신 것을 환영합니다.</p>

      <form id="login-form" class="mt-8 space-y-4">
        <div>
          <label for="email" class="block text-xs font-medium mb-1.5">이메일 또는 아이디</label>
          <input id="email" type="text" autocomplete="username" placeholder="example@email.com"
            class="w-full border border-neutral-300 px-4 py-3 text-sm placeholder:text-neutral-400 outline-none focus:border-neutral-900 transition" />
        </div>
        <div>
          <label for="pw" class="block text-xs font-medium mb-1.5">비밀번호</label>
          <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요"
            class="w-full border border-neutral-300 px-4 py-3 text-sm placeholder:text-neutral-400 outline-none focus:border-neutral-900 transition" />
        </div>
        <p id="msg" role="alert" class="hidden text-xs text-red-600"></p>
        <button id="submit" type="submit" class="w-full bg-neutral-900 text-white py-3.5 text-sm font-medium hover:bg-black transition disabled:opacity-60">로그인</button>
      </form>

      <div class="mt-5 flex items-center justify-center gap-4 text-xs text-neutral-500">
        <a href="#" class="hover:text-neutral-900">아이디/비밀번호 찾기</a>
        <span class="w-px h-3 bg-neutral-300"></span>
        <a href="signup.html" class="hover:text-neutral-900">회원가입</a>
      </div>

      <div class="mt-8 flex items-center gap-3 text-xs text-neutral-400">
        <span class="flex-1 h-px bg-neutral-200"></span>SNS 계정으로 로그인<span class="flex-1 h-px bg-neutral-200"></span>
      </div>

      <div class="mt-5 flex justify-center gap-4">
        <!-- 네이버 -->
        <button type="button" data-provider="naver" aria-label="네이버 로그인" class="w-12 h-12 rounded-full bg-[#03C75A] flex items-center justify-center hover:opacity-90 transition">
          <svg viewBox="0 0 24 24" class="w-5 h-5" fill="#fff"><path d="M16.3 12.6 7.4 3H3v18h4.7v-9.6L16.6 21H21V3h-4.7z"/></svg>
        </button>
        <!-- 카카오 -->
        <button type="button" data-provider="kakao" aria-label="카카오 로그인" class="w-12 h-12 rounded-full bg-[#FEE500] flex items-center justify-center hover:opacity-90 transition">
          <svg viewBox="0 0 24 24" class="w-6 h-6" fill="#191919"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.3 4.6 6.7l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.5.1 1.1.1 1.6.1 5.5 0 10-3.6 10-8S17.500 3 12 3z"/></svg>
        </button>
        <!-- 구글 -->
        <button type="button" data-provider="google" aria-label="구글 로그인" class="w-12 h-12 rounded-full bg-white border border-neutral-300 flex items-center justify-center hover:bg-neutral-50 transition">
          <svg viewBox="0 0 24 24" class="w-5 h-5"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.500-.2-2.200H12v4.200h6.200a5.300 5.300 0 0 1-2.300 3.500v2.900h3.700c2.200-2 3.400-5 3.400-8.400z"/><path fill="#34A853" d="M12 23.500c3.100 0 5.700-1 7.600-2.800l-3.700-2.900c-1 .7-2.300 1.100-3.900 1.100-3 0-5.500-2-6.400-4.700H1.800v3A11.500 11.500 0 0 0 12 23.500z"/><path fill="#FBBC05" d="M5.600 14.200a6.900 6.900 0 0 1 0-4.400v-3H1.800a11.500 11.500 0 0 0 0 10.400z"/><path fill="#EA4335" d="M12 5.100c1.700 0 3.200.6 4.400 1.700l3.300-3.300A11.500 11.500 0 0 0 1.800 6.800l3.800 3c.9-2.700 3.400-4.700 6.400-4.700z"/></svg>
        </button>
      </div>
    </div>
  </main>
  <script>
    const sb = supabase.createClient(
      'https://ufxtbxbpqfbrfkzqggte.supabase.co',
      'sb_publishable_IR5BPytyjwWunxNGrqLiuQ_FHKbCWTd'
    );
    const msg = document.getElementById('msg');
    const show = (t) => { msg.textContent = t; msg.classList.remove('hidden'); };

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.classList.add('hidden');
      const btn = document.getElementById('submit');
      btn.disabled = true;
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('pw').value,
      });
      btn.disabled = false;
      if (error) return show('이메일 또는 비밀번호를 확인해 주세요.');
      location.href = 'index.html';
    });

    document.querySelectorAll('[data-provider]').forEach((b) => b.addEventListener('click', async () => {
      const provider = b.dataset.provider;
      if (provider === 'naver') return show('네이버 로그인은 아직 지원되지 않습니다.');
      const { error } = await sb.auth.signInWithOAuth({
        provider,
        options: { redirectTo: location.origin + '/index.html' },
      });
      if (error) show('소셜 로그인에 실패했습니다.');
    }));
  </script>
</body>
</html>
